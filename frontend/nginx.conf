server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API proxy -> backend service.
    #
    # The upstream is held in a variable on purpose. With a literal host,
    # nginx resolves it once at startup and exits with
    # "host not found in upstream" if the backend is not up yet — so the
    # container cannot start on its own and crash-loops whenever the backend
    # restarts. Using a variable defers resolution to request time, so the
    # frontend serves the SPA regardless of backend state and reconnects
    # automatically once it returns.
    location /api/ {
        resolver 127.0.0.11 ipv6=off valid=10s;   # Docker's embedded DNS
        set $upstream_api "http://backend:8000";
        proxy_pass $upstream_api$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Benchmark runs make many sequential LLM calls.
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }
}
